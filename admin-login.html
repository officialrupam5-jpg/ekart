<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ekart Courier | Admin Login</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --error: #b91c1c;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 1rem; color: var(--text); background: linear-gradient(135deg, rgba(30,58,138,.92), rgba(37,99,235,.78)), url("assets/courier-truck.jpg") center / cover fixed; }
    .login-card { width: min(100%, 420px); padding: 2rem; background: rgba(255,255,255,.97); border: 1px solid rgba(255,255,255,.6); border-radius: 16px; box-shadow: 0 24px 70px rgba(2,6,23,.28); }
    .brand { margin: 0 0 1.5rem; color: var(--primary); font-size: 1.2rem; font-weight: 800; }
    h1 { margin: 0 0 .4rem; font-size: 1.7rem; }
    .description { margin: 0 0 1.5rem; color: var(--muted); }
    label { display: block; margin-top: 1rem; font-size: .9rem; font-weight: 650; }
    input { width: 100%; margin-top: .35rem; padding: .8rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
    input:focus { outline: 2px solid #93c5fd; border-color: var(--primary); }
    button { width: 100%; margin-top: 1.25rem; padding: .85rem 1rem; border: 0; border-radius: 8px; background: var(--primary); color: white; font-size: 1rem; font-weight: 700; cursor: pointer; }
    button:hover { background: var(--primary-dark); }
    .message { min-height: 1.5rem; margin-top: .8rem; color: var(--error); font-size: .9rem; }
    .back-link { display: inline-block; margin-top: 1rem; color: var(--primary); font-weight: 650; text-decoration: none; }
  </style>
</head>
<body>
  <main class="login-card">
    <p class="brand">📦 Ekart Courier</p>
    <h1 id="heading">Admin login</h1>
    <p class="description">Sign in to manage shipments.</p>
    <form id="loginForm">
      <label for="userId">Admin user ID
        <input id="userId" type="text" inputmode="numeric" autocomplete="username" required />
      </label>
      <label for="password">Admin password
        <input id="password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit">Log in</button>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>
    <a class="back-link" href="index.html">Back to tracking</a>
  </main>
  <script>
    const SESSION_KEY = "ekartAdminAuthenticated";
    const ADMIN_USER_ID = "24061999";
    const ADMIN_PASSWORD = "24061999";
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    if (sessionStorage.getItem(SESSION_KEY) === "true") {
      window.location.replace("admin.html");
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      message.textContent = "";
      const userId = document.getElementById("userId").value.trim();
      const password = document.getElementById("password").value;
      if (userId === ADMIN_USER_ID && password === ADMIN_PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, "true");
        window.location.replace("admin.html");
      } else {
        message.textContent = "Incorrect user ID or password. Try again.";
      }
    });
  </script>
</body>
</html>
